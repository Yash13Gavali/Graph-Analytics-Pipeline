# ---------------------------------------------------------------------------
# Real-Time Graph Analytics & NYC Taxi Demand Forecasting
# Local development stack: Zookeeper, Kafka, Neo4j (APOC + GDS), Spark cluster
#
#   docker compose up -d
#   docker compose ps
#   docker compose down -v          # tears down volumes as well
#
# Host-facing endpoints:
#   Kafka broker ............ localhost:29092
#   Neo4j Browser ........... http://localhost:7474
#   Neo4j Bolt .............. bolt://localhost:7687
#   Spark Master UI ......... http://localhost:8080
#   Spark Worker UIs ........ http://localhost:8081 , http://localhost:8082
#   Spark application UI .... http://localhost:4040
# ---------------------------------------------------------------------------

name: nyc-taxi-graph

x-spark-common-env: &spark-common-env
  SPARK_MASTER_URL: spark://spark-master:7077
  SPARK_RPC_AUTHENTICATION_ENABLED: "no"
  SPARK_RPC_ENCRYPTION_ENABLED: "no"
  SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
  SPARK_SSL_ENABLED: "no"
  SPARK_USER: spark
  SPARK_DAEMON_MEMORY: 1g

x-spark-common-volumes: &spark-common-volumes
  - ./jars:/opt/spark/user-jars:ro
  - ./conf/spark:/opt/bitnami/spark/conf/custom:ro
  - ./data:/opt/spark/data
  - ./checkpoints:/opt/spark/checkpoints
  - spark-events:/opt/spark/events

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:

  # -------------------------------------------------------------------------
  # Coordination
  # -------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: nyctaxi-zookeeper
    hostname: zookeeper
    restart: unless-stopped
    ports:
      - "${ZOOKEEPER_HOST_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_INIT_LIMIT: 10
      ZOOKEEPER_SYNC_LIMIT: 5
      ZOOKEEPER_MAX_CLIENT_CNXNS: 128
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 1
      ZOOKEEPER_4LW_COMMANDS_WHITELIST: "srvr,mntr,ruok,stat,conf"
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - taxi-net
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Event streaming
  # -------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nyctaxi-kafka
    hostname: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
      - "${KAFKA_JMX_PORT:-9101}:9101"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ZOOKEEPER_CONNECTION_TIMEOUT_MS: 30000

      # INTERNAL is what containers on taxi-net use; HOST is for the developer
      # machine, which resolves the broker as localhost.
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Trip events are replayable for a week; compaction is handled per-topic.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_NUM_NETWORK_THREADS: 4
      KAFKA_NUM_IO_THREADS: 8

      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx1G"
      CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 45s
    networks:
      - taxi-net
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Graph store
  # -------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.19.0-enterprise
    container_name: nyctaxi-neo4j
    hostname: neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-taxigraph_local}"

      # Plugin activation. APOC supplies the batching/periodic-iterate
      # procedures used by the ingestion writer; GDS backs the centrality and
      # community-detection passes over the pickup/dropoff zone graph.
      NEO4J_PLUGINS: '["apoc","graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_apoc_trigger_enabled: "true"

      NEO4J_server_default__listen__address: "0.0.0.0"
      NEO4J_server_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_server_http_listen__address: "0.0.0.0:7474"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL:-1G}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX:-2G}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE:-1G}"
      NEO4J_db_transaction_timeout: "300s"
      NEO4J_db_transaction_concurrent_maximum: 64
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_metrics_prometheus_enabled: "true"
      NEO4J_server_metrics_prometheus_endpoint: "0.0.0.0:2004"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-plugins:/plugins
      - ./data/neo4j-import:/var/lib/neo4j/import
      - ./conf/neo4j:/var/lib/neo4j/conf/custom:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-taxigraph_local} 'RETURN 1' >/dev/null 2>&1"
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    ulimits:
      nofile:
        soft: 40000
        hard: 40000
    networks:
      - taxi-net
    logging: *default-logging

  # -------------------------------------------------------------------------
  # Spark cluster
  # -------------------------------------------------------------------------
  spark-master:
    image: bitnami/spark:3.5.1
    container_name: nyctaxi-spark-master
    hostname: spark-master
    restart: unless-stopped
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_DRIVER_UI_PORT:-4040}:4040"
      - "${SPARK_HISTORY_PORT:-18080}:18080"
    environment:
      <<: *spark-common-env
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      SPARK_DAEMON_JAVA_OPTS: >-
        -Dspark.deploy.recoveryMode=FILESYSTEM
        -Dspark.deploy.recoveryDirectory=/opt/spark/events/recovery
    volumes: *spark-common-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - taxi-net
    logging: *default-logging

  spark-worker-1:
    image: bitnami/spark:3.5.1
    container_name: nyctaxi-spark-worker-1
    hostname: spark-worker-1
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER_1_UI_PORT:-8081}:8081"
    environment:
      <<: *spark-common-env
      SPARK_MODE: worker
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-2}"
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-2G}"
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_DIR: /opt/spark/work
    volumes: *spark-common-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - taxi-net
    logging: *default-logging

  spark-worker-2:
    image: bitnami/spark:3.5.1
    container_name: nyctaxi-spark-worker-2
    hostname: spark-worker-2
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER_2_UI_PORT:-8082}:8081"
    environment:
      <<: *spark-common-env
      SPARK_MODE: worker
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-2}"
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-2G}"
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_DIR: /opt/spark/work
    volumes: *spark-common-volumes
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081 >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - taxi-net
    logging: *default-logging

networks:
  taxi-net:
    name: nyctaxi-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  zookeeper-data:
    name: nyctaxi-zookeeper-data
  zookeeper-logs:
    name: nyctaxi-zookeeper-logs
  kafka-data:
    name: nyctaxi-kafka-data
  neo4j-data:
    name: nyctaxi-neo4j-data
  neo4j-logs:
    name: nyctaxi-neo4j-logs
  neo4j-plugins:
    name: nyctaxi-neo4j-plugins
  spark-events:
    name: nyctaxi-spark-events
